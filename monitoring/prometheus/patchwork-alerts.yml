groups:
  - name: patchwork-staging-critical
    rules:
      - alert: PatchworkApiErrorRateHigh
        expr: sum(rate(patchwork_sli_error_total{service="api",environment="staging"}[5m])) / clamp_min(sum(rate(patchwork_sli_request_total{service="api",environment="staging"}[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations: { runbook_url: "docs/operations/incident-response.md#api-error-rate" }
      - alert: PatchworkIndexerDisconnected
        expr: patchwork_event_source_connected{service="indexer",environment="staging"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { runbook_url: "docs/operations/incident-response.md#indexer-disconnect-or-lag" }
      - alert: PatchworkIndexerLagHigh
        expr: patchwork_event_source_lag_seconds{service="indexer",environment="staging"} > 300
        for: 5m
        labels: { severity: critical }
        annotations: { runbook_url: "docs/operations/incident-response.md#indexer-disconnect-or-lag" }
      - alert: PatchworkModerationQueueOldestItemHigh
        expr: moderation_queue_oldest_item_age_seconds{service="moderation-worker",environment="staging"} > 900
        for: 5m
        labels: { severity: warning }
        annotations: { runbook_url: "docs/operations/incident-response.md#moderation-queue-age" }
      - alert: PatchworkDatabaseUnavailable
        expr: up{job="patchwork-postgres",environment="staging"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { runbook_url: "docs/operations/incident-response.md#database-unavailable" }
      - alert: PatchworkBackupFailed
        expr: patchwork_backup_last_attempt_success{environment="staging"} == 0
        for: 1m
        labels: { severity: warning }
        annotations: { runbook_url: "docs/operations/disaster-recovery.md#backup-monitoring" }
      - alert: PatchworkBackupStale
        expr: time() - patchwork_backup_last_success_timestamp_seconds{environment="staging"} > 27000
        for: 5m
        labels: { severity: warning }
        annotations: { runbook_url: "docs/operations/disaster-recovery.md#backup-monitoring" }
      - alert: PatchworkRetentionFailed
        expr: patchwork_retention_last_attempt_success{service="api",environment="staging"} == 0
        for: 5m
        labels: { severity: warning }
        annotations: { runbook_url: "docs/operations/incident-response.md#retention-enforcement" }
      - alert: PatchworkRetentionStale
        expr: time() - patchwork_retention_last_success_timestamp_seconds{service="api",environment="staging"} > 7200
        for: 5m
        labels: { severity: warning }
        annotations: { runbook_url: "docs/operations/incident-response.md#retention-enforcement" }
      - alert: PatchworkAttachmentDeletionFailed
        expr: patchwork_attachment_deletion_failures_pending{service="api",environment="staging"} > 0
        for: 5m
        labels: { severity: warning }
        annotations: { runbook_url: "docs/operations/incident-response.md#private-attachment-deletion" }
      - alert: PatchworkAttachmentPipelineSweepFailed
        expr: increase(patchwork_attachment_pipeline_sweep_failures_total{service="api",environment="staging"}[15m]) > 0
        labels: { severity: warning }
        annotations: { runbook_url: "docs/operations/incident-response.md#private-attachment-deletion" }
      - alert: PatchworkModerationRetentionFailed
        expr: moderation_retention_last_attempt_success{service="moderation-worker",environment="staging"} == 0
        for: 5m
        labels: { severity: warning }
        annotations: { runbook_url: "docs/operations/incident-response.md#retention-enforcement" }
      - alert: PatchworkModerationRetentionStale
        expr: time() - moderation_retention_last_success_timestamp_seconds{service="moderation-worker",environment="staging"} > 7200
        for: 5m
        labels: { severity: warning }
        annotations: { runbook_url: "docs/operations/incident-response.md#retention-enforcement" }
