services:
  postgres:
    image: postgres:16-alpine
    container_name: patchwork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: patchwork
      POSTGRES_USER: patchwork
      # DEV ONLY — safe default for local development; never use in production.
      POSTGRES_PASSWORD: ${PATCHWORK_POSTGRES_PASSWORD:-patchwork}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patchwork -d patchwork']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - patchwork-postgres-data:/var/lib/postgresql/data
  objects:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: patchwork-objects
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${ATTACHMENT_OBJECT_ACCESS_KEY:-patchwork-dev}
      MINIO_ROOT_PASSWORD: ${ATTACHMENT_OBJECT_SECRET_KEY:-patchwork-dev-secret-key}
    ports:
      - '9000:9000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 18
    volumes:
      - patchwork-object-data:/data
  clamav:
    image: clamav/clamav@sha256:6b7c8e09559250f25b0184516b0a2ae805136e57485260e16c780c9fd6e6aba9
    container_name: patchwork-clamav
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1 >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 360s
    volumes:
      - patchwork-clamav-signatures:/var/lib/clamav

volumes:
  patchwork-postgres-data:
  patchwork-object-data:
  patchwork-clamav-signatures:
