# Staging environment compose file -- mirrors production topology (#108).
#
# Usage:
#   docker compose -f docker-compose.staging.yml up -d --build
#
# This file maintains parity with docker-compose.yml (production) so that
# staging validates the same service topology, networking, and health checks
# before promotion to production.

services:
    postgres:
        image: postgres:16-alpine
        container_name: patchwork-staging-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: patchwork
            POSTGRES_USER: patchwork
            POSTGRES_PASSWORD: ${PATCHWORK_STAGING_POSTGRES_PASSWORD:?Set PATCHWORK_STAGING_POSTGRES_PASSWORD in .env}
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U patchwork -d patchwork']
            interval: 5s
            timeout: 3s
            retries: 20
        volumes:
            - patchwork-staging-postgres-data:/var/lib/postgresql/data
        networks:
            staging-internal:

    patchwork-api:
        image: ${PATCHWORK_API_IMAGE:-patchwork-api:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: api-runtime
        container_name: patchwork-staging-api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            patchwork-api-migrations:
                condition: service_completed_successfully
            patchwork-indexer-migrations:
                condition: service_completed_successfully
            patchwork-spool:
                condition: service_healthy
            patchwork-thimble:
                condition: service_healthy
        environment:
            NODE_ENV: production
            PATCHWORK_ENV: staging
            LOG_LEVEL: ${LOG_LEVEL:-info}
            ATPROTO_SERVICE_DID: ${STAGING_ATPROTO_SERVICE_DID:?Set STAGING_ATPROTO_SERVICE_DID in .env}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            ATPROTO_ACCOUNT_PDS_URL: ${ATPROTO_ACCOUNT_PDS_URL:?Set private PDS origin}
            ATPROTO_OAUTH_CLIENT_ID: ${STAGING_ATPROTO_OAUTH_CLIENT_ID:?Set STAGING_ATPROTO_OAUTH_CLIENT_ID}
            ATPROTO_OAUTH_REDIRECT_URI: ${STAGING_ATPROTO_OAUTH_REDIRECT_URI:?Set STAGING_ATPROTO_OAUTH_REDIRECT_URI}
            ATPROTO_SESSION_ENCRYPTION_KEY: ${STAGING_ATPROTO_SESSION_ENCRYPTION_KEY:?Set STAGING_ATPROTO_SESSION_ENCRYPTION_KEY}
            API_HOST: 0.0.0.0
            API_PORT: 4000
            API_PUBLIC_ORIGIN: ${STAGING_PUBLIC_ORIGIN:?Set STAGING_PUBLIC_ORIGIN}
            API_TRUSTED_PROXIES: ${STAGING_API_TRUSTED_PROXIES:?Set STAGING_API_TRUSTED_PROXIES to your trusted proxy IPs/CIDRs before starting staging.}
            API_MAX_PROJECTION_LAG_SECONDS: ${STAGING_API_MAX_PROJECTION_LAG_SECONDS:-300}
            API_RETENTION_INTERVAL_SECONDS: ${STAGING_API_RETENTION_INTERVAL_SECONDS:-3600}
            API_DATA_SOURCE: postgres
            API_DATABASE_URL: postgresql://patchwork:${PATCHWORK_STAGING_POSTGRES_PASSWORD:?Set PATCHWORK_STAGING_POSTGRES_PASSWORD in .env}@patchwork-staging-postgres:5432/patchwork
            API_MODERATION_SERVICE_URL: http://patchwork-staging-thimble:4200
            MODERATION_SERVICE_TOKEN: ${STAGING_MODERATION_SERVICE_TOKEN:?Set STAGING_MODERATION_SERVICE_TOKEN in .env}
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health/ready >/dev/null']
            interval: 10s
            timeout: 3s
            retries: 18
        networks:
            staging-internal:
            staging-web:
                aliases:
                    - patchwork-staging-api

    patchwork-spool:
        image: ${PATCHWORK_INDEXER_IMAGE:-patchwork-indexer:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: indexer-runtime
        container_name: patchwork-staging-spool
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4100/health/ready >/dev/null']
            interval: 10s
            timeout: 3s
            retries: 12
        depends_on:
            postgres:
                condition: service_healthy
            patchwork-indexer-migrations:
                condition: service_completed_successfully
            patchwork-api-migrations:
                condition: service_completed_successfully
        environment:
            NODE_ENV: production
            PATCHWORK_ENV: staging
            LOG_LEVEL: ${LOG_LEVEL:-info}
            ATPROTO_SERVICE_DID: ${STAGING_ATPROTO_SERVICE_DID:?Set STAGING_ATPROTO_SERVICE_DID in .env}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            INDEXER_PORT: 4100
            INDEXER_FIREHOSE_URL: ${INDEXER_FIREHOSE_URL:-wss://jetstream2.us-east.bsky.network/subscribe}
            DATABASE_URL: postgresql://patchwork:${PATCHWORK_STAGING_POSTGRES_PASSWORD:?Set PATCHWORK_STAGING_POSTGRES_PASSWORD in .env}@patchwork-staging-postgres:5432/patchwork
        networks:
            staging-internal:
            staging-web:
                aliases:
                    - patchwork-staging-spool

    patchwork-indexer-migrations:
        image: ${PATCHWORK_INDEXER_IMAGE:-patchwork-indexer:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: indexer-runtime
        restart: "no"
        command: ['npm', 'run', 'db:migrate', '-w', '@patchwork/indexer']
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            ATPROTO_SERVICE_DID: ${STAGING_ATPROTO_SERVICE_DID:?Set STAGING_ATPROTO_SERVICE_DID in .env}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            DATABASE_URL: postgresql://patchwork:${PATCHWORK_STAGING_POSTGRES_PASSWORD:?Set PATCHWORK_STAGING_POSTGRES_PASSWORD in .env}@patchwork-staging-postgres:5432/patchwork
        networks:
            staging-internal:

    patchwork-thimble:
        image: ${PATCHWORK_MODERATION_IMAGE:-patchwork-moderation:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: moderation-runtime
        container_name: patchwork-staging-thimble
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PATCHWORK_ENV: staging
            LOG_LEVEL: ${LOG_LEVEL:-info}
            ATPROTO_SERVICE_DID: ${STAGING_ATPROTO_SERVICE_DID:?Set STAGING_ATPROTO_SERVICE_DID in .env}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            DATABASE_URL: postgresql://patchwork:${PATCHWORK_STAGING_POSTGRES_PASSWORD:?Set PATCHWORK_STAGING_POSTGRES_PASSWORD in .env}@patchwork-staging-postgres:5432/patchwork
            MODERATION_PORT: 4200
            MODERATION_WORKER_CONCURRENCY: ${MODERATION_WORKER_CONCURRENCY:-2}
            MODERATION_RETENTION_INTERVAL_SECONDS: ${STAGING_MODERATION_RETENTION_INTERVAL_SECONDS:-3600}
            MODERATION_SERVICE_TOKEN: ${STAGING_MODERATION_SERVICE_TOKEN:?Set STAGING_MODERATION_SERVICE_TOKEN in .env}
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4200/health/ready >/dev/null']
            interval: 10s
            timeout: 3s
            retries: 18
        depends_on:
            postgres:
                condition: service_healthy
            patchwork-moderation-migrations:
                condition: service_completed_successfully
        networks:
            staging-internal:

    patchwork-moderation-migrations:
        image: ${PATCHWORK_MODERATION_IMAGE:-patchwork-moderation:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: moderation-runtime
        restart: "no"
        command: ['npm', 'run', 'db:migrate', '-w', '@patchwork/moderation-worker']
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            ATPROTO_SERVICE_DID: ${STAGING_ATPROTO_SERVICE_DID:?Set STAGING_ATPROTO_SERVICE_DID in .env}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            DATABASE_URL: postgresql://patchwork:${PATCHWORK_STAGING_POSTGRES_PASSWORD:?Set PATCHWORK_STAGING_POSTGRES_PASSWORD in .env}@patchwork-staging-postgres:5432/patchwork
        networks:
            staging-internal:

    patchwork-api-migrations:
        image: ${PATCHWORK_API_IMAGE:-patchwork-api:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: api-runtime
        restart: "no"
        command: ['npm', 'run', 'db:migrate', '-w', '@patchwork/api']
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            ATPROTO_SERVICE_DID: ${STAGING_ATPROTO_SERVICE_DID:?Set STAGING_ATPROTO_SERVICE_DID in .env}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            ATPROTO_ACCOUNT_PDS_URL: ${ATPROTO_ACCOUNT_PDS_URL:-https://pds.subcult.tv}
            API_DATA_SOURCE: postgres
            API_DATABASE_URL: postgresql://patchwork:${PATCHWORK_STAGING_POSTGRES_PASSWORD:?Set PATCHWORK_STAGING_POSTGRES_PASSWORD in .env}@patchwork-staging-postgres:5432/patchwork
        networks:
            staging-internal:

    patchwork-web:
        image: ${PATCHWORK_WEB_IMAGE:-patchwork-web:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: web-runtime
            args:
                VITE_APP_NAME: 'Patchwork (Staging)'
                VITE_API_BASE_URL: ${STAGING_VITE_API_BASE_URL:?Set STAGING_VITE_API_BASE_URL}
                VITE_DATA_MODE: api
        container_name: patchwork-staging-web
        restart: unless-stopped
        depends_on:
            patchwork-api:
                condition: service_healthy
        volumes:
            - type: bind
              source: ${STAGING_PATCHWORK_PM_TILES_PATH:?Set STAGING_PATCHWORK_PM_TILES_PATH to the host us.pmtiles file}
              target: /srv/patchwork-map/us.pmtiles
              read_only: true
              bind:
                  create_host_path: false
        networks:
            staging-web:
                aliases:
                    - patchwork-staging-web

volumes:
    patchwork-staging-postgres-data:

networks:
    staging-internal:
        driver: bridge
    staging-web:
        external: true
        name: staging-web
